name: Recovery Build

on:
  workflow_dispatch:

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    env:
      SYNC_URL: https://gitlab.com/OrangeFox/sync.git
      MANIFEST_BRANCH: "14.1"
      DEVICE_TREE_URL: https://github.com/aum47/android_device_motorola_roadstr
      DEVICE_TREE_BRANCH: main
      DEVICE_PATH: device/motorola/roadstr
      DEVICE_NAME: roadstr
      MAKEFILE_NAME: twrp_roadstr-ap2a-eng
      BUILD_TARGET: recovery
      KERNEL_VERSION: 6.6.139-MioTest-gf77elb4f66al
      TZ: Asia/Kolkata

    steps:
      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Initialize workspace
        id: pwd
        run: |
          mkdir -p "$GITHUB_WORKSPACE/workspace"
          echo "workspace-folder=$GITHUB_WORKSPACE/workspace" >> "$GITHUB_OUTPUT"

      - name: Prepare the build environment
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            git \
            python3 \
            tar \
            aria2 \
            curl

          curl -fL -o android_build_env.sh \
            https://gitlab.com/OrangeFox/misc/scripts/-/raw/master/setup/android_build_env.sh

          sudo bash android_build_env.sh

      - name: Install OpenJDK
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: "11"

      - name: Sync OrangeFox sources and minimal manifest
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}
        run: |
          git clone --depth=1 "$SYNC_URL" sync
          cd sync
          ./orangefox_sync.sh \
            --branch "$MANIFEST_BRANCH" \
            --path "$GITHUB_WORKSPACE/workspace/fox_$MANIFEST_BRANCH"

      - name: Get latest bootable/recovery commit
        id: recovery_commit
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}/bootable/recovery
        run: |
          RECOVERY_COMMIT=$(git rev-parse --short=7 HEAD)
          echo "RECOVERY_COMMIT=$RECOVERY_COMMIT" >> "$GITHUB_OUTPUT"
          echo "bootable/recovery commit: $RECOVERY_COMMIT"

      - name: Clone device tree
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}
        run: |
          git clone --depth=1 \
            -b "$DEVICE_TREE_BRANCH" \
            "$DEVICE_TREE_URL" \
            "$DEVICE_PATH"

      - name: Get latest device tree commit
        id: devtree_commit
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}/${{ env.DEVICE_PATH }}
        run: |
          LATEST_COMMIT=$(git rev-parse --short=7 HEAD)
          echo "LATEST_COMMIT=$LATEST_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Device tree commit: $LATEST_COMMIT"

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 30

      - name: Show system resources
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}
        run: |
          nproc
          free -h
          df -h

      - name: Set kernel version text
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}
        run: |
          mkdir -p "out/target/product/$DEVICE_NAME/obj/PACKAGING/check_vintf_all_intermediates"
          printf '%s\n' "$KERNEL_VERSION" \
            > "out/target/product/$DEVICE_NAME/obj/PACKAGING/check_vintf_all_intermediates/kernel_version.txt"

      - name: Build recovery
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}
        run: |
          source build/envsetup.sh

          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_TYPE="Stable"
          export FOX_MAINTAINER_PATCH_VERSION="8"

          lunch "$MAKEFILE_NAME"
          mka adbd "${BUILD_TARGET}image" -j"$(nproc --all)"

      - name: Show system resources after build
        if: always()
        working-directory: ${{ steps.pwd.outputs.workspace-folder }}
        run: |
          nproc
          free -h
          df -h

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/OrangeFox-R*.img
            ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/OrangeFox-R*.zip
          fail_on_unmatched_files: true
          name: ${{ env.DEVICE_NAME }}-${{ env.DEVICE_TREE_BRANCH }}-${{ steps.devtree_commit.outputs.LATEST_COMMIT }}
          tag_name: ${{ github.run_id }}
          body: |
            Manifest: ${{ env.MANIFEST_BRANCH }}
            Device: ${{ env.DEVICE_NAME }}
            Target: ${{ env.BUILD_TARGET }}
            Kernel version: ${{ env.KERNEL_VERSION }}
            Device tree branch: ${{ env.DEVICE_TREE_BRANCH }}
            Device tree commit: ${{ steps.devtree_commit.outputs.LATEST_COMMIT }}
            Device tree URL: ${{ env.DEVICE_TREE_URL }}/tree/${{ steps.devtree_commit.outputs.LATEST_COMMIT }}
            bootable/recovery commit: ${{ steps.recovery_commit.outputs.RECOVERY_COMMIT }}
            Recovery source URL: https://gitlab.com/OrangeFox/bootable/Recovery/tree/${{ steps.recovery_commit.outputs.RECOVERY_COMMIT }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
